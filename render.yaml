services:
  - type: web
    name: diamond-chicken-pos-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: RESTAURANT_NAME
        value: Diamond Chicken
      - key: RESTAURANT_ADDRESS
        value: Naiks Corner, Herbert Chitepo Street, Bulawayo
      - key: RESTAURANT_PHONE
        value: +263 771 234 567
      - key: RESTAURANT_VAT
        value: VAT123456789
      - key: TAX_RATE
        value: "0.15"
      - key: FRONTEND_URL
        value: https://diamond-chicken-pos.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
